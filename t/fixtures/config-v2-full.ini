[global]
vcs               = git
output_dir        = /var/lib/changetrack-ng
push_remote       = origin
ignore            = *.swp *~ *.bak
sensitive_auto    = 1
sensitive_notify  = suppress
warn_special_files = 1
interval          = 3600
lock_path         = /var/run/changetrack-ng.lock
lock_timeout      = 0

[notifier:email:default]
enabled      = true
from         = changetrack-ng@localhost

[notifier:webhook:default]
enabled      = true
url          = https://hooks.example.com/changetrack
full_diff    = 0
heartbeat    = 0
insecure     = 0

[notifier:otlp:default]
enabled            = true
endpoint           = https://otel.example.com/v1/logs
full_diff          = 0
compression        = gzip
timeout            = 10
insecure           = 0
heartbeat          = 1

[notifier:file:default]
enabled      = true
path         = /var/log/changetrack-ng.log
heartbeat    = 0

[track]
/etc/passwd : root@localhost
/etc/hosts
DIRECTORY /etc/nginx : admin@example.com
DIRECTORY /etc/ssl/private sensitive=yes
