[global]
vcs                      = git
output_dir               = /var/lib/changetrack-ng
notify                   = email webhook
email_from               = changetrack-ng@localhost
push_remote              = origin
webhook_url              = https://hooks.example.com/changetrack
webhook_full_diff        = 0
webhook_heartbeat        = 0
webhook_insecure         = 0
otlp_endpoint            = https://otel.example.com/v1/logs
otlp_full_diff           = 0
otlp_compression         = gzip
otlp_timeout             = 10
otlp_insecure            = 0
otlp_headers             =
otlp_resource_attributes =
otlp_heartbeat           = 1
notify_log_path          = /var/log/changetrack-ng.log
file_heartbeat           = 0
ignore                   = *.swp *~ *.bak
sensitive_auto           = 1
sensitive_notify         = suppress
warn_special_files       = 1
interval                 = hourly
lock_path                = /var/run/changetrack-ng.lock
lock_timeout             = 0

[track]
/etc/passwd : root@localhost
/etc/hosts
DIRECTORY /etc/nginx : admin@example.com
DIRECTORY /etc/ssl/private sensitive=yes
