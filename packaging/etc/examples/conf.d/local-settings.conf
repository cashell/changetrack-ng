# changetrack-ng - example conf.d drop-in
#
# Files in conf.d/ may contain only [global] sections.
# Drop this file in /etc/changetrack-ng/conf.d/ to extend or override
# global settings without modifying the main config file.
# This directory is loaded automatically only when it is a sibling of the
# main config file; use @include for custom locations.
#
# The array-valued key push_remote is appended across files.  Scalar-valued
# keys in conf.d/*.conf override values set in the main config file
# (conflicting definitions across multiple conf.d/*.conf files are a fatal
# parse error).

[global]

# Push history to a central collection server after each commit.
# push_remote = origin backup

# Override global settings such as file size threshold or lock timeout.
# Note: to configure ignore patterns, use an [ignore] section in the main
# config file, a track.d/*.conf drop-in, or an ignore.d/*.conf drop-in.
# max_file_size = 10485760
# lock_timeout = 30
