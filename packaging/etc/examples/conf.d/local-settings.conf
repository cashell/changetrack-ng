# changetrack-ng — example conf.d drop-in
#
# Files in conf.d/ may contain only [global] sections.
# Drop this file in /etc/changetrack-ng/conf.d/ to extend or override
# global settings without modifying the main config file.
#
# Array-valued keys (ignore, push_remote) are appended to any values
# already set in the main config.  Scalar-valued keys must not conflict
# with values set in the main config (fatal parse error).

[global]

# Push history to a central collection server after each commit.
# push_remote = origin backup

# Extend the ignore list with site-specific patterns.
# ignore = *.lock *.pid *.tmp
