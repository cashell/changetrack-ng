# changetrack-ng — example notifier.d drop-in (email)
#
# Files in notifier.d/ may contain only [notifier:*] sections.
# Drop this file in /etc/changetrack-ng/notifier.d/ to configure email
# notifications without modifying the main config file.
# This directory is loaded automatically only when it is a sibling of the
# main config file; use @include-notifier for custom locations.
#
# HOSTNAME in values is replaced with the system FQDN at parse time.
# Multiple [notifier:email:*] instances are supported; use distinct names.

[notifier:email:default]
enabled = true
from    = changetrack-ng@HOSTNAME
to      = root@localhost
