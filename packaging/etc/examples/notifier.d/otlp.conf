# changetrack-ng — example notifier.d drop-in (OTLP)
#
# Files in notifier.d/ may contain only [notifier:*] sections.
# Drop this file in /etc/changetrack-ng/notifier.d/ to ship change events
# to an OpenTelemetry collector without modifying the main config file.
#
# SECURITY: If the endpoint requires authentication, prefer injecting the
# bearer token via the OTEL_EXPORTER_OTLP_HEADERS environment variable
# rather than writing it into the headers key below.  Set file mode 0640.

[notifier:otlp:default]
enabled     = true
endpoint    = https://otelcol.example.com:4318/v1/logs
compression = gzip
heartbeat   = 1
# headers   = Authorization=Bearer\ ${OTLP_TOKEN}
# resource_attributes = deployment.environment=prod service.name=changetrack-ng
