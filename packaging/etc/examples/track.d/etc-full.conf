# changetrack-ng - example track.d drop-in: whole /etc tracking
#
# Files in track.d/ may contain [track] and [ignore] sections.
# Drop this file in /etc/changetrack-ng/track.d/ to track all of /etc
# while excluding noisy, volatile, or generated subtrees and runtime files.
# This directory is loaded automatically only when it is a sibling of the
# main config file; use @include-track for custom locations.
#
# Tracking the entire /etc hierarchy captures system configuration changes
# automatically without listing every individual service directory, but
# requires ignoring flapping runtime state, dynamic network configurations,
# certificate renewal trees, and binary caches.

[track]
DIRECTORY /etc

[ignore]
# Dynamic runtime state, mounts, and lock files
mtab*
adjtime
resolv.conf
.pwd.lock
nologin

# Shared library cache and update-alternatives
ld.so.cache
alternatives/

# Hardware and device database
udev/hwdb.bin

# LVM metadata caches and archives
lvm/cache/
lvm/archive/

# Ephemeral network runtime files
network/run/

# Print daemon subscription state
cups/subscriptions.conf*

# TLS/SSL certificates and automated renewal trees
letsencrypt/
ssl/certs/
pki/ca-trust/extracted/
