# changetrack-ng — example track.d drop-in
#
# Files in track.d/ may contain only [track] sections.
# Drop this file in /etc/changetrack-ng/track.d/ to add tracked paths
# without modifying the main config file.
# This directory is loaded automatically only when it is a sibling of the
# main config file; use @include-track for custom locations.
#
# Useful for: application-specific tracking shipped by a package,
# site-wide additions managed by a configuration management tool, or
# splitting a large track list across logical groups.

[track]
# Core system identity files
/etc/passwd
/etc/group
/etc/shadow
/etc/hosts
/etc/hostname
/etc/fstab

# SSH server configuration (auto-detected as sensitive)
DIRECTORY /etc/ssh

# SSL/TLS private keys — mark sensitive explicitly regardless of mode
DIRECTORY /etc/ssl/private sensitive=yes

# Sudoers
/etc/sudoers
DIRECTORY /etc/sudoers.d

# Network configuration
/etc/resolv.conf
DIRECTORY /etc/NetworkManager/system-connections
