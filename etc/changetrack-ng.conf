# changetrack-ng — default configuration
#
# All options shown with default values.
# For detailed documentation, see the full reference config or the man page:
#   man changetrack-ng.conf
# Example configs installed to: /usr/share/doc/changetrack-ng/examples/

###################################################################
# Global Configuration
###################################################################
#
[global]

##########################
# Core
##########################
#
# VCS backend: rcs | git | fossil | svn | hg
vcs = git

# Directory where tracked file history is stored
output_dir = /var/lib/changetrack-ng

# Remote(s) to push to after each commit (space-separated)
# Applies to whole-repo backends (git, fossil, svn, hg).
push_remote =

##########################
# Scheduling
##########################
#
# Run interval in seconds for systemd/cron install targets.
# This value is informational only and not read at runtime.
interval = 3600

##########################
# Locking
##########################
#
# Lock file path (only one instance runs at a time)
lock_path = /var/run/changetrack-ng.lock

# Seconds to wait for lock; 0 = skip silently if locked (cron-friendly)
lock_timeout = 0

##########################
# Sensitive Files
##########################
#
# Auto-detect sensitive files by mode (lacks group+world read = sensitive)
sensitive_auto = 1

# Handling of sensitive diffs in notifications: suppress | allow
sensitive_notify = suppress

##########################
# Special File Warnings
##########################
#
# Warn on non-regular files (sockets, FIFOs, device nodes, hard links)
warn_special_files = 1

###################################################################
# File Tracking
###################################################################

##########################
# Ignore Patterns
##########################
#
# Additional glob patterns to skip during directory traversal
# (space-separated).  Applied on top of built-in defaults.
#
# Built-in defaults already exclude common noise:
#   editor temp files:  *.swp  *~  #*#  .*.sw?  *.bak
#   archives:           *.gz  *.bz2  *.bzip2  *.xz  *.zst  *.7z
#                       *.zip  *.tar  *.tgz  *.tbz2  *.txz
#   package manager:    *.dpkg-*  *.rpmnew  *.rpmsave  *.pacnew  *.pacorig
#   compiled bytecode:  *.pyc  *.pyo  *.elc
#   system runtime:     mtab  ld.so.cache  prelink.cache  adjtime
#                       udev/hwdb.bin  lvm/cache  lvm/archive
ignore =

###################################################################
# Notifiers
###################################################################
#
# Configure notification channels using [notifier:<type>:<name>] sections.
# Each section must include: enabled = true | false
# Disabled instances are discarded at parse time.
# Multiple instances of the same type are supported (use different names).
#
# Drop-in configs in notifier.d/ sibling directory are also loaded automatically.
# See examples at: /usr/share/doc/changetrack-ng/examples/notifier.d/

[notifier:email:default]
enabled         = false
from            = changetrack-ng@HOSTNAME
# to            = root@localhost
# sendmail_path = /usr/sbin/sendmail

[notifier:webhook:default]
enabled         = false
# url           =
# full_diff     = 0
# heartbeat     = 0
# timeout       = 10
# insecure      = 0

[notifier:otlp:default]
enabled         = false
# endpoint      =
# compression   = gzip
# full_diff     = 0
# heartbeat     = 1
# timeout       = 10
# insecure      = 0
# headers       =
# resource_attributes =
# emit_recipients  = 0    ; include notified recipients as config_change.notified attribute
# max_diff_bytes   = 0    ; cap config_change.diff byte length (0 = unlimited)
# severity_change  = INFO ; OTel severity for change/create/remove events
# severity_heartbeat = DEBUG ; OTel severity for heartbeat events
# severity_warning   = WARN  ; OTel severity for run-warning events

[notifier:file:default]
enabled         = false
# path          = /var/log/changetrack-ng.jsonl
# full_diff     = 0
# heartbeat     = 0
# emit_recipients  = 0    ; include notified recipients as config_change.notified attribute
# max_diff_bytes   = 0    ; cap config_change.diff byte length (0 = unlimited)
# severity_change  = INFO ; OTel severity for change/create/remove events
# severity_heartbeat = DEBUG ; OTel severity for heartbeat events
# severity_warning   = WARN  ; OTel severity for run-warning events

###################################################################
# Track List
###################################################################
#
[track]
#
# Each line specifies a file or directory to track.
#
# Syntax:
#   /absolute/path/to/file [: email@example.com ...] [option=value ...]
#   DIRECTORY /absolute/path [: email@example.com ...] [option=value ...]
#
# Optional per-entry recipients (after the colon) override the email
# notifier's default to= for that entry.
#
# Per-entry options: sensitive=yes|no|auto
#
# Examples:
# /etc/passwd : root@localhost
# /etc/hosts
# DIRECTORY /etc/ssh
# DIRECTORY /etc/nginx : admin@example.com
# DIRECTORY /etc/ssl/private sensitive=yes
#
# Drop-in track entries in track.d/ sibling directory are also loaded.
# See examples at: /usr/share/doc/changetrack-ng/examples/track.d/
