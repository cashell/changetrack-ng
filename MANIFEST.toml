# MANIFEST.toml - Authoritative file inventory for changetrack-ng.
#
# Fields per file:
#   description  - one-line description (required)
#   install_path - installed path with $(MAKE_VAR) placeholders (when installed)
#   permissions  - installed file permissions: "0755", "0644", "0640"
#   dist         - tarballs/packages that include this file:
#                  "full"    make dist (full source tarball)
#                  "deploy"  make dist-deploy (production deployment tarball)
#                  "minimal" make dist-minimal (fatpacked single-file tarball)
#                  "deb"     Debian/Ubuntu dpkg-buildpackage
#                  "rpm"     RHEL/Fedora rpmbuild
#                  "arch"    Arch Linux PKGBUILD (future)
#   tags         - semantic labels for filtering and AI navigation
#   tested_by    - library modules: which t/*.t files cover this module
#   tests        - test files: which modules/behaviors are under test
#   notes        - non-obvious context or caveats

[meta]
version     = "0.7.3"
updated     = "2026-10-12"
homepage    = "https://github.com/cashell/changetrack-ng"
license     = "GPL-3.0-or-later"
min_perl    = "5.20"

# Runtime and build dependencies

[[meta.deps]]
name         = "perl"
relationship = "requires"
version      = ">= 5.20"
deb_package  = "perl"
rpm_package  = "perl"
notes        = "Core modules HTTP::Tiny, JSON::PP, IO::Compress::Gzip (all core >= 5.14)"

[[meta.deps]]
name         = "git"
relationship = "requires_one_of"
group        = "vcs_backend"
deb_package  = "git"
rpm_package  = "git"

[[meta.deps]]
name         = "rcs"
relationship = "requires_one_of"
group        = "vcs_backend"
deb_package  = "rcs"
rpm_package  = "rcs"

[[meta.deps]]
name         = "fossil"
relationship = "requires_one_of"
group        = "vcs_backend"
deb_package  = "fossil"
rpm_package  = "fossil"

[[meta.deps]]
name         = "subversion"
relationship = "requires_one_of"
group        = "vcs_backend"
deb_package  = "subversion"
rpm_package  = "subversion"

[[meta.deps]]
name         = "mercurial"
relationship = "requires_one_of"
group        = "vcs_backend"
deb_package  = "mercurial"
rpm_package  = "mercurial"

[[meta.deps]]
name         = "sendmail"
relationship = "recommends"
deb_package  = "sendmail | postfix | exim4"
rpm_package  = "postfix"
notes        = "Required only when using the Email notifier"

[[meta.deps]]
name         = "TOML::Tiny"
relationship = "build_requires"
source       = "system"
deb_package  = "libtoml-tiny-perl"
rpm_package  = "perl-TOML-Tiny"
cpan_module  = "TOML::Tiny"
notes        = "Required for tools/manifest-query"

[[meta.deps]]
name         = "App::FatPacker"
relationship = "build_optional"
source       = "system"
deb_package  = "libapp-fatpacker-perl"
rpm_package  = "perl-App-FatPacker"
cpan_module  = "App::FatPacker"
notes        = "Required for make fatpack only"

[[meta.deps]]
name         = "pod2man"
relationship = "build_requires"
source       = "system"
deb_package  = "perl"
rpm_package  = "perl"
notes        = "Included in standard Perl packages; required for make install-man"

# program -- the main CLI executable

[program."bin/changetrack-ng"]
description  = "CLI entry point; option parsing and subcommand dispatch"
install_path = "$(BINDIR)/changetrack-ng"
permissions  = "0755"
dist         = ["full", "deploy"]
tags         = ["cli", "entry-point"]

# library -- core ChangeTrack:: modules

[library."lib/ChangeTrack/Config.pm"]
description  = "INI v2 config parser; strict key validation; requires v2 INI format"
install_path = "$(LIBDIR)/ChangeTrack/Config.pm"
permissions  = "0644"
dist         = ["full", "deploy"]
tags         = ["core", "config"]
tested_by    = ["t/23-config-resolution.t", "t/24-config-sections.t",
                "t/25-config-drop-in-dirs.t", "t/26-config-include-directives.t",
                "t/27-config-cross-file-errors.t"]

[library."lib/ChangeTrack/Lock.pm"]
description  = "flock(2)-based pidfile locking; timeout and force-unlock modes"
install_path = "$(LIBDIR)/ChangeTrack/Lock.pm"
permissions  = "0644"
dist         = ["full", "deploy"]
tags         = ["core", "locking"]
tested_by    = ["t/12-locking.t"]

[library."lib/ChangeTrack/Metadata.pm"]
description  = "JSONL sidecar metadata store; stat snapshots; atomic save via tmpfile+rename"
install_path = "$(LIBDIR)/ChangeTrack/Metadata.pm"
permissions  = "0644"
dist         = ["full", "deploy"]
tags         = ["core", "metadata"]
tested_by    = ["t/03-metadata.t", "t/37-review-findings.t"]

[library."lib/ChangeTrack/Report.pm"]
description  = "Per-run change accumulator; collects file diffs and events for notifier dispatch"
install_path = "$(LIBDIR)/ChangeTrack/Report.pm"
permissions  = "0644"
dist         = ["full", "deploy"]
tags         = ["core", "reporting"]
tested_by    = ["t/21-report.t"]

[library."lib/ChangeTrack/Runner.pm"]
description  = "Main orchestration engine; config to lock to file scan to VCS commit to notify"
install_path = "$(LIBDIR)/ChangeTrack/Runner.pm"
permissions  = "0644"
dist         = ["full", "deploy"]
tags         = ["core", "orchestration"]
tested_by    = ["t/04-runner-rcs.t", "t/10-sensitive.t", "t/11-ignore.t",
                "t/16-subcommands.t", "t/17-precommit-checks.t", "t/22-verbose-debug.t",
                "t/37-review-findings.t"]

[library."lib/ChangeTrack/Util.pm"]
description  = "Shared utilities: hostname(), run_cmd() via IPC::Open3, sync_mirror_path(), set_debug()"
install_path = "$(LIBDIR)/ChangeTrack/Util.pm"
permissions  = "0644"
dist         = ["full", "deploy"]
tags         = ["core", "utility"]
tested_by    = ["t/20-util-symlink-mirror.t", "t/22-verbose-debug.t"]

[library."lib/ChangeTrack/Version.pm"]
description  = "Single-source version authority; all other modules reference this"
install_path = "$(LIBDIR)/ChangeTrack/Version.pm"
permissions  = "0644"
dist         = ["full", "deploy"]
tags         = ["core", "version"]
tested_by    = ["t/00-load.t"]

########################################################################
# library_vcs -- VCS backend modules
########################################################################

[library_vcs."lib/ChangeTrack/VCS/Base.pm"]
description  = "Abstract base class for VCS backends; defines commit/diff/log/revert interface"
install_path = "$(LIBDIR)/ChangeTrack/VCS/Base.pm"
permissions  = "0644"
dist         = ["full", "deploy"]
tags         = ["vcs", "base"]
tested_by    = ["t/05-vcs-rcs.t", "t/06-vcs-git.t", "t/13-vcs-fossil.t",
                "t/14-vcs-svn.t", "t/15-vcs-hg.t"]

[library_vcs."lib/ChangeTrack/VCS/Git.pm"]
description  = "Git VCS backend; whole-repo mirror model; batch commit; optional push_remote"
install_path = "$(LIBDIR)/ChangeTrack/VCS/Git.pm"
permissions  = "0644"
dist         = ["full", "deploy"]
tags         = ["vcs", "git"]
tested_by    = ["t/06-vcs-git.t"]

[library_vcs."lib/ChangeTrack/VCS/RCS.pm"]
description  = "RCS VCS backend; per-file model; colon-encoded flat layout; immediate ci -l"
install_path = "$(LIBDIR)/ChangeTrack/VCS/RCS.pm"
permissions  = "0644"
dist         = ["full", "deploy"]
tags         = ["vcs", "rcs"]
tested_by    = ["t/05-vcs-rcs.t"]

[library_vcs."lib/ChangeTrack/VCS/Fossil.pm"]
description  = "Fossil VCS backend; whole-repo mirror; uses native --chdir flag (no process chdir)"
install_path = "$(LIBDIR)/ChangeTrack/VCS/Fossil.pm"
permissions  = "0644"
dist         = ["full", "deploy"]
tags         = ["vcs", "fossil"]
tested_by    = ["t/13-vcs-fossil.t"]

[library_vcs."lib/ChangeTrack/VCS/SVN.pm"]
description  = "Subversion VCS backend; whole-repo mirror; absolute working-copy paths without chdir"
install_path = "$(LIBDIR)/ChangeTrack/VCS/SVN.pm"
permissions  = "0644"
dist         = ["full", "deploy"]
tags         = ["vcs", "svn"]
tested_by    = ["t/14-vcs-svn.t"]

[library_vcs."lib/ChangeTrack/VCS/Mercurial.pm"]
description  = "Mercurial VCS backend; whole-repo mirror; uses hg -R flag (no chdir)"
install_path = "$(LIBDIR)/ChangeTrack/VCS/Mercurial.pm"
permissions  = "0644"
dist         = ["full", "deploy"]
tags         = ["vcs", "mercurial"]
tested_by    = ["t/15-vcs-hg.t"]

########################################################################
# library_notify -- notifier modules
########################################################################

[library_notify."lib/ChangeTrack/Notify/Base.pm"]
description  = "Abstract base class for notifiers; defines send/heartbeat interface"
install_path = "$(LIBDIR)/ChangeTrack/Notify/Base.pm"
permissions  = "0644"
dist         = ["full", "deploy"]
tags         = ["notify", "base"]
tested_by    = ["t/07-notify-email.t", "t/08-notify-webhook.t",
                "t/09-notify-file.t", "t/19-notify-otlp.t", "t/37-review-findings.t"]

[library_notify."lib/ChangeTrack/Notify/Email.pm"]
description  = "Email notifier; pipes unified diffs to sendmail; heartbeat unconditionally off"
install_path = "$(LIBDIR)/ChangeTrack/Notify/Email.pm"
permissions  = "0644"
dist         = ["full", "deploy"]
tags         = ["notify", "email"]
tested_by    = ["t/07-notify-email.t", "t/18-integration-notifiers.t"]

[library_notify."lib/ChangeTrack/Notify/File.pm"]
description  = "File notifier; appends JSON change events to a local log file"
install_path = "$(LIBDIR)/ChangeTrack/Notify/File.pm"
permissions  = "0644"
dist         = ["full", "deploy"]
tags         = ["notify", "file"]
tested_by    = ["t/09-notify-file.t", "t/18-integration-notifiers.t"]

[library_notify."lib/ChangeTrack/Notify/Webhook.pm"]
description  = "Webhook notifier; HTTP POST JSON to endpoint; 3-attempt retry; TLS bypass option"
install_path = "$(LIBDIR)/ChangeTrack/Notify/Webhook.pm"
permissions  = "0644"
dist         = ["full", "deploy"]
tags         = ["notify", "webhook"]
tested_by    = ["t/08-notify-webhook.t", "t/18-integration-notifiers.t"]

[library_notify."lib/ChangeTrack/Notify/OTLP.pm"]
description  = "OTLP notifier; structured log events via HTTP+JSON; gzip; env-var precedence"
install_path = "$(LIBDIR)/ChangeTrack/Notify/OTLP.pm"
permissions  = "0644"
dist         = ["full", "deploy"]
tags         = ["notify", "otlp", "opentelemetry"]
tested_by    = ["t/19-notify-otlp.t", "t/18-integration-notifiers.t"]

